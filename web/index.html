<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Elevora - Speak English Confidently at Work | Managerial English</title>
    <meta name="description" content="A structured, practical and AI-powered learning journey to build real workplace communication skills for professionals, managers, and students." />
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CDN with custom brand colors -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#080C16',
                surface: '#0E1726',
                card: '#141E33',
                gold: '#F59E0B',
                goldLight: '#FBBF24',
                amber: '#E5A638',
                border: '#1E293B',
                accent: '#3B82F6'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #080C16;
        color: #F8FAFC;
        overflow-x: hidden;
      }
      .glow-gold {
        box-shadow: 0 0 40px -10px rgba(245, 158, 11, 0.35);
      }
      .glass-card {
        background: rgba(20, 30, 51, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body class="bg-[#080C16] text-slate-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
